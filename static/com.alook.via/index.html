<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta content="en-us" http-equiv="Content-Language" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="title"></title>
    <script type="text/javascript">
        var d = new Date()
        var time = d.getHours()
        if (time < 24) {
            document
                .getElementById("title")
                .innerHTML = "Good evening!";
        }
        if (time < 19) {
            document
                .getElementById("title")
                .innerHTML = "Good afternoon!";
        }
        if (time < 12) {
            document
                .getElementById("title")
                .innerHTML = "Good morning!";
        }
        if (time < 5) {
            document
                .getElementById("title")
                .innerHTML = "Go to sleep!";
        }
    </script>

    @-webkit-keyframes flipInX {
        0% {
            -webkit-transform: perspective(400px) rotateX(90deg);
            transform: perspective(400px) rotateX(90deg);
            opacity: 0;

        40% {
            -webkit-transform: perspective(400px) rotateX(-10deg);
            transform: perspective(400px) rotateX(-10deg);
        }

        70% {
            -webkit-transform: perspective(400px) rotateX(10deg);
            transform: perspective(400px) rotateX(10deg);

    .custom-select {

    /* 为不支持background-clip的浏览器提供回退 */

                    <script defer data-pjax>
                        const isEmpty = function (obj) {
                            if (typeof obj == "undefined" || obj == null || obj == "") {
                                return true;
                            }
                            return false;
                        }

                        // 设置默认的一言内容
                        const defaultHitokoto = "人，这辈子，不就是笑笑别人，和被别人笑笑嘛。";

                        const hitokotoText = document.querySelector('#hitokoto_text');
                        const hitokotoFrom = document.querySelector('#hitokoto_from');

                        if (!isEmpty(hitokotoText)) {
                            // 检查是否为本地文件（file://协议）
                            if (window.location.protocol === 'file:') {
                                // 本地文件时直接显示默认内容
                                hitokotoText.innerText = defaultHitokoto;
                                if (!isEmpty(hitokotoFrom)) {
                                    hitokotoFrom.innerText = "";
                                }
                            } else {
                                // 非本地文件时尝试获取在线一言
                                fetch('https://v1.hitokoto.cn')
                                    .then(response => {
                                        if (!response.ok) {
                                            throw new Error('Network response was not ok');
                                        }
                                        return response.json();
                                    })
                                    .then(data => {
                                        hitokotoText.href = `https://hitokoto.cn/?uuid=${data.uuid}`;
                                        hitokotoText.innerText = data.hitokoto;

                                        if (!isEmpty(hitokotoFrom)) {
                                            var from = "";
                                            if (!isEmpty(data.from_who) || !isEmpty(data.from)) {
                                                from += " —— ";
                                                if (!isEmpty(data.from_who)) {
                                                    from += data.from_who;
                                                }
                                                if (!isEmpty(data.from)) {
                                                    from += "「" + data.from + "」";
                                                }
                                            }
                                            hitokotoFrom.innerText = from;
                                        }
                                    })
                                    .catch(err => {
                                        console.log('获取一言失败，使用默认内容:', err);
                                        hitokotoText.innerText = defaultHitokoto;
                                        if (!isEmpty(hitokotoFrom)) {
                                            hitokotoFrom.innerText = "";
                                        }
                                    });
                            }
                        }
                    </script>
                </div>
            </div>

    <script type="text/javascript">
        var last_kw = '';
        var max_sug_len = 1; //搜索建议最短触发长度

        /*获取搜索建议
        采用的百度搜索的服务
        */
        function get_suggest() {
            var kw = document
                .getElementById('search_input')
                .value;
            var clear = document.getElementById('clear');
            if (kw)
                clear.style.display = 'block';
            else
                clear.style.display = 'none';
            if (kw == last_kw)
                return;
            last_kw = kw;
            if (!kw || kw.length < max_sug_len) {
                close_sug();
                return;
            }
            var script = document.createElement('script');
            script.type = 'text/javascript';
            script.src = 'https://sugs.m.sm.cn/web?t=w&uc_param_str=dnnwnt&scheme=http&fr=android&bid=1&q=' + encodeURIComponent(kw) + '&_=' + new Date().getTime() + '&callback=jsonp3';
            var head = document.querySelector('head');
            script.onload = function () {
                head.removeChild(script);
            };
            head.appendChild(script);
        }

        function jsonp3(res) {
            var suggest = document.getElementById('suggest');
            var searchBar = document.querySelector('.search_bar');
            if (!res.r || !res.r.length) {
                suggest.style.display = 'none';
                searchBar.classList.remove('suggest-open');
                return;
            }
            var html = '';
            res
                .r
                .forEach(function (v) {
                    html += '<li>' + v.w + '<b></b></li>';
                });
            document
                .getElementById('suglist')
                .innerHTML = html;
            suggest.style.display = 'block';
            searchBar.classList.add('suggest-open');
        }

        function close_sug() {
            last_kw = '';
            var suggest = document.getElementById('suggest');
            var searchBar = document.querySelector('.search_bar');
            suggest.style.display = 'none';
            searchBar.classList.remove('suggest-open');
        }

        function move_input() {
            document.body.scrollTop = document
                .getElementById('search_form')
                .offsetTop - 2;
        }

        function clear_seach() {
            var input = document.getElementById('search_input');
            input.value = '';
            document
                .getElementById('clear')
                .style
                .display = 'none';
            close_sug();
            input.focus();
        }

        function search() {
            if (document.getElementById("search_input").value != "") {
                window.location.href = "https://m.baidu.com/s?ie=utf-8&rn=30&tn=baiduhome_pg&oq=%E5%BC%A0%E7%B1%BD%E6%B2%90&rsv_enter=0&wd=" + document
                    .getElementById("search_input")
                    .value;
                document
                    .getElementById("search_input")
                    .value = "";
            }
            return false;
        }

        document
            .getElementById('suglist')
            .addEventListener('click', function (e) {
                var input = document.getElementById('search_input');
                if (e.target.tagName == 'B') {
                    input.value = e.target.parentNode.firstChild.textContent;
                    input.blur();
                } else if (e.target.tagName == 'LI') {
                    input.value = e.target.firstChild.textContent;
                    input.blur();
                    close_sug();
                    search();
                }
            });
        window.addEventListener('resize', move_input);

        /* 多搜索引擎功能 */
        document.addEventListener("DOMContentLoaded", function () {
            var h,
                b = document.getElementById("search_submit"),
                customSelect = document.createElement("div"),
                selectTrigger = document.createElement("div"),
                selectOptions = document.createElement("div"),
                currentEngine = localStorage.se || "i",
                g = {
                    i: { name: "默认", url: "https://m.baidu.com/s?ie=utf-8&rn=30&tn=baiduhome_pg&wd=" },
                    bd: { name: "百度", url: "https://m.baidu.com/s?ie=utf-8&rn=30&tn=baiduhome_pg&wd=" },
                    gg: { name: "谷歌", url: "https://www.google.com/search?q=" },
                    bing: { name: "必应", url: "https://cn.bing.com/search?q=" },
                    dk: { name: "Duck", url: "https://duckduckgo.com/?q=" },
                    gk: { name: "夸克", url: "https://quark.sm.cn/s?q=" },
                    sg: { name: "搜狗", url: "https://wap.sogou.com/web/searchList.jsp?keyword=" },
                    tt: { name: "头条", url: "https://m.toutiao.com/search/?keyword=" },
                    gh: { name: "GitHub", url: "https://github.com/search?q=" },
                    so: { name: "StackOF", url: "https://stackoverflow.com/search?q=" }, c: { name: "其他", url: localStorage.c || "" },
                    m: { name: "重设", disabled: !localStorage.c && "disabled" }
                };

            // 生成随机渐变颜色的函数
            function generateRandomGradient() {
                var colors = [
                    '#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#feca57', '#ff9ff3',
                    '#a8e6cf', '#dcedc1', '#ffd3a5', '#fd9853', '#74b9ff', '#0984e3',
                    '#6c5ce7', '#a29bfe', '#fd79a8', '#fdcb6e', '#e17055', '#00b894',
                    '#00cec9', '#55a3ff', '#ff7675', '#fab1a0', '#e84393', '#f39c12',
                    '#ff7979', '#81ecec', '#74b9ff', '#a29bfe', '#fd79a8', '#fdcb6e'
                ];

                // 随机选择4-6个颜色
                var numColors = Math.floor(Math.random() * 3) + 4;
                var selectedColors = [];
                var colorsCopy = colors.slice(); // 创建副本避免修改原数组

                for (var i = 0; i < numColors; i++) {
                    var randomIndex = Math.floor(Math.random() * colorsCopy.length);
                    selectedColors.push(colorsCopy[randomIndex]);
                    colorsCopy.splice(randomIndex, 1); // 避免重复颜色
                }

                // 随机角度
                var angle = Math.floor(Math.random() * 360);

                return 'linear-gradient(' + angle + 'deg, ' + selectedColors.join(', ') + ')';
            }

            // 应用随机渐变到触发器
            function applyRandomGradient() {
                var gradient = generateRandomGradient();
                document.documentElement.style.setProperty('--trigger-gradient', gradient);
            }

            // 创建自定义下拉框结构
            customSelect.className = "custom-select";
            selectTrigger.className = "custom-select-trigger";
            selectOptions.className = "custom-options";

            // 设置触发器文本
            selectTrigger.textContent = g[currentEngine].name;

            // 应用初始随机渐变
            applyRandomGradient();

            // 生成选项
            var optionsHTML = "";
            for (h in g) {
                if (!g[h].disabled) {
                    var selectedClass = h === currentEngine ? " selected" : "";
                    optionsHTML += '<div class="custom-option' + selectedClass + '" data-value="' + h + '">' + g[h].name + '</div>';
                }
            }
            selectOptions.innerHTML = optionsHTML;

            // 组装下拉框
            customSelect.appendChild(selectTrigger);
            customSelect.appendChild(selectOptions);

            // 插入到搜索框中
            b.parentElement.insertBefore(customSelect, b);

            // 点击触发器显示/隐藏选项
            selectTrigger.addEventListener('click', function (e) {
                e.stopPropagation();
                customSelect.classList.toggle('opened');
            });

            // 点击选项
            selectOptions.addEventListener('click', function (e) {
                if (e.target.classList.contains('custom-option')) {
                    var value = e.target.dataset.value;
                    var name = e.target.textContent;

                    if (value === "c") {
                        var customUrl = prompt("请修改自定义地址\n注：via上取消也可能会清空(′⊙ω⊙`)", localStorage.c);
                        customUrl = (customUrl || "").trim(); if (customUrl) {
                            localStorage.c = customUrl;
                            g.c.url = customUrl;
                            currentEngine = "c";
                            localStorage.se = "c";
                            selectTrigger.textContent = "其他";
                            applyRandomGradient();
                            // 重新生成选项列表，使重设选项可用
                            updateOptions();
                            // 重新生成选项列表，使重设选项可用
                            updateOptions();
                        } else {
                            currentEngine = "i";
                            localStorage.se = "i";
                            selectTrigger.textContent = "默认";
                            applyRandomGradient();
                        }
                    } else if (value === "m") {
                        if (localStorage.c) {
                            localStorage.removeItem('c');
                            localStorage.removeItem('se');
                            currentEngine = "i";
                            selectTrigger.textContent = "默认";
                            applyRandomGradient();
                            // 重新生成选项列表
                            updateOptions();
                        }
                    } else {
                        currentEngine = value;
                        localStorage.se = value;
                        selectTrigger.textContent = name;
                        applyRandomGradient();
                    }

                    // 更新选中状态
                    selectOptions.querySelectorAll('.custom-option').forEach(function (option) {
                        option.classList.remove('selected');
                    });
                    e.target.classList.add('selected');

                    // 关闭下拉框
                    customSelect.classList.remove('opened');
                }
            });

            // 点击其他地方关闭下拉框
            document.addEventListener('click', function () {
                customSelect.classList.remove('opened');
            });

            // 更新选项列表
            function updateOptions() {
                var optionsHTML = "";
                // 只要有自定义搜索引擎URL，就启用"重设"选项
                g.m.disabled = !localStorage.c && "disabled";
                for (h in g) {
                    if (!g[h].disabled) {
                        var selectedClass = h === currentEngine ? " selected" : "";
                        optionsHTML += '<div class="custom-option' + selectedClass + '" data-value="' + h + '">' + g[h].name + '</div>';
                    }
                }
                selectOptions.innerHTML = optionsHTML;
            }

            // 重写搜索函数
            search = function () {
                var a = document.getElementById("search_input");
                a.value = a.value.trim();
                if (a.value) {
                    window.location.href = g[currentEngine].url + encodeURIComponent(a.value);
                    a.value = "";
                    return false;
                }
                return false;
            };
        });

        /* 主题模式切换 */
        let media = window.matchMedia('(prefers-color-scheme: dark)');
        let callback = (e) => {
            let prefersDarkMode = e.matches;
            if (prefersDarkMode) {
                document
                    .documentElement
                    .setAttribute('data-theme', 'dark');
            } else {
                document
                    .documentElement
                    .setAttribute('data-theme', 'light');
            }
            // javascript:location.reload();
        };
        if (typeof media.addEventListener === 'function') {
            media.addEventListener('change', callback);
        } else if (typeof media.addListener === 'function') {
            media.addListener(callback);
        }
    </script>
